services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mosaic
      POSTGRES_USER: mosaic
      POSTGRES_PASSWORD: mosaic
    ports:
      - "55432:5432"
    volumes:
      - mosaic_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosaic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mosaic_postgres:
